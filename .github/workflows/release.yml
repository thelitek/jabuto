name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  web:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '22'
          cache: true
      - run: vp build
      # The site root holds the latest release; keep_files preserves pr-preview/.
      - uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          keep_files: true

  android:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.JABUTO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '22'
          cache: true
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: vp run android:sync
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.JABUTO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/jabuto.jks"
      - name: Build signed APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          JABUTO_KEYSTORE_FILE: ${{ runner.temp }}/jabuto.jks
          JABUTO_KEYSTORE_PASSWORD: ${{ secrets.JABUTO_KEYSTORE_PASSWORD }}
          JABUTO_KEY_ALIAS: ${{ secrets.JABUTO_KEY_ALIAS }}
          JABUTO_KEY_PASSWORD: ${{ secrets.JABUTO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Attach APK to the release
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "jabuto-$TAG.apk"
          gh release upload "$TAG" "jabuto-$TAG.apk"
      - name: No signing key configured
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::JABUTO_KEYSTORE_BASE64 is not set; no APK was attached to this release."
