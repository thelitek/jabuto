name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.number }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        if: github.event.action != 'closed'
        with:
          node-version: '22'
          cache: true
      - run: vp build
        if: github.event.action != 'closed'
      # Serves the web build at https://<owner>.github.io/jabuto/pr-preview/pr-<n>/
      - uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
